[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webpage-content-extractor"
version = "0.1.0"
description = "IR-first extractor: Webpage-Complete lesson + audio -> Markdown/DOCX/manifest with duration-matched transcripts"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "python-docx>=1.1,<2",
  "Pillow>=10,<13",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
transcribe = [
  "faster-whisper>=1.0,<2",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
course-extract = "course_extractor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/course_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
